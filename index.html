<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ML Roadmap — Tan's Checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0f;
    --surface: #16161a;
    --surface2: #1e1e24;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.13);
    --text: #e8e6e0;
    --muted: #7a7870;
    --dim: #4a4845;

    --blue: #4f8ef7;
    --blue-bg: rgba(79,142,247,0.1);
    --green: #4ecb8d;
    --green-bg: rgba(78,203,141,0.1);
    --amber: #f5a623;
    --amber-bg: rgba(245,166,35,0.1);
    --purple: #a78bfa;
    --purple-bg: rgba(167,139,250,0.1);
    --coral: #f87171;
    --coral-bg: rgba(248,113,113,0.1);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
    padding: 0 0 80px;
  }

  /* noise texture overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.35;
  }

  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 24px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  header {
    padding: 52px 0 40px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 40px;
  }

  .header-label {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  h1 {
    font-family: 'Space Mono', monospace;
    font-size: clamp(22px, 4vw, 32px);
    font-weight: 700;
    color: var(--text);
    line-height: 1.2;
    margin-bottom: 16px;
  }

  h1 span {
    color: var(--blue);
  }

  .header-meta {
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }

  .progress-pill {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 99px;
    padding: 6px 16px 6px 10px;
  }

  .progress-circle {
    width: 28px;
    height: 28px;
  }

  .progress-circle svg {
    transform: rotate(-90deg);
  }

  .progress-circle circle {
    fill: none;
    stroke-width: 3;
    stroke-linecap: round;
  }

  .progress-circle .track { stroke: var(--border2); }
  .progress-circle .fill { stroke: var(--blue); transition: stroke-dashoffset 0.5s ease; }

  .progress-text {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--text);
  }

  .progress-text span {
    color: var(--muted);
  }

  .reset-btn {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.05em;
  }

  .reset-btn:hover {
    color: var(--text);
    border-color: var(--border2);
    background: var(--surface);
  }

  /* Phase cards */
  .phase {
    margin-bottom: 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .phase:hover { border-color: var(--border2); }

  .phase-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 20px;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
  }

  .phase-header:hover { background: var(--surface2); }

  .phase-num {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    width: 30px;
    height: 30px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .phase-info { flex: 1; min-width: 0; }

  .phase-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 2px;
  }

  .phase-sub {
    font-size: 12px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
  }

  .phase-right {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .phase-count {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }

  .phase-chevron {
    color: var(--dim);
    font-size: 12px;
    transition: transform 0.25s ease;
  }

  .phase.open .phase-chevron { transform: rotate(180deg); }

  .phase-bar {
    height: 2px;
    background: var(--border);
    margin: 0 20px;
  }

  .phase-bar-fill {
    height: 2px;
    border-radius: 1px;
    transition: width 0.4s ease;
    width: 0%;
  }

  /* Tasks */
  .phase-body {
    display: none;
    padding: 14px 20px 20px;
  }

  .phase.open .phase-body { display: block; }

  .task {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: opacity 0.15s;
  }

  .task:last-of-type { border-bottom: none; }
  .task:hover { opacity: 0.85; }

  .task-check {
    width: 20px;
    height: 20px;
    border-radius: 5px;
    border: 1.5px solid var(--dim);
    background: transparent;
    flex-shrink: 0;
    margin-top: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }

  .task.done .task-check {
    border-color: var(--green);
    background: var(--green-bg);
  }

  .task.done .task-check::after {
    content: '';
    display: block;
    width: 5px;
    height: 9px;
    border: 2px solid var(--green);
    border-top: none;
    border-left: none;
    transform: rotate(45deg) translate(-1px, -1px);
  }

  .task-text {
    font-size: 14px;
    color: var(--text);
    flex: 1;
    line-height: 1.5;
    transition: color 0.2s;
  }

  .task.done .task-text {
    color: var(--dim);
    text-decoration: line-through;
    text-decoration-color: var(--muted);
  }

  .task-tag {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 4px;
    flex-shrink: 0;
    margin-top: 3px;
    letter-spacing: 0.04em;
  }

  /* Resources */
  .resources {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }

  .res-label {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--dim);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .res-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .res-chip {
    font-size: 12px;
    padding: 5px 11px;
    border-radius: 6px;
    border: 1px solid var(--border2);
    color: var(--muted);
    background: var(--surface2);
    cursor: default;
    transition: all 0.15s;
  }

  .res-chip:hover {
    color: var(--text);
    border-color: rgba(255,255,255,0.2);
  }

  /* Footer total */
  .footer {
    margin-top: 48px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  .footer-note {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--dim);
  }

  .footer-note a {
    color: var(--muted);
    text-decoration: none;
  }

  /* Animations */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .phase {
    animation: fadeIn 0.4s ease both;
  }

  .phase:nth-child(1) { animation-delay: 0.05s; }
  .phase:nth-child(2) { animation-delay: 0.1s; }
  .phase:nth-child(3) { animation-delay: 0.15s; }
  .phase:nth-child(4) { animation-delay: 0.2s; }
  .phase:nth-child(5) { animation-delay: 0.25s; }

  @media (max-width: 520px) {
    .phase-header { padding: 14px 16px; }
    .phase-body { padding: 12px 16px 16px; }
    .phase-bar { margin: 0 16px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="header-label">// ml-roadmap / checklist</div>
    <h1>Build &amp; Train a<br><span>Custom ML Model</span></h1>
    <div class="header-meta">
      <div class="progress-pill">
        <div class="progress-circle">
          <svg width="28" height="28" viewBox="0 0 28 28">
            <circle class="track" cx="14" cy="14" r="11" stroke-dasharray="69.1" stroke-dashoffset="0"/>
            <circle class="fill" id="global-ring" cx="14" cy="14" r="11" stroke-dasharray="69.1" stroke-dashoffset="69.1"/>
          </svg>
        </div>
        <span class="progress-text" id="global-text">0 <span>/ 24 tasks</span></span>
      </div>
      <button class="reset-btn" onclick="resetAll()">↺ reset</button>
    </div>
  </header>

  <div id="phases"></div>

  <div class="footer">
    <span class="footer-note">progress saved in browser · localStorage</span>
    <span class="footer-note">// beginner track</span>
  </div>
</div>

<script>
const PHASES = [
  {
    title: "Math & Python foundations",
    weeks: "Weeks 1–4",
    color: "#4f8ef7",
    colorBg: "rgba(79,142,247,0.12)",
    tasks: [
      { text: "Review linear algebra basics: vectors, matrices, dot products", tag: "Math" },
      { text: "Learn calculus fundamentals: derivatives and the chain rule", tag: "Math" },
      { text: "Get comfortable with probability & statistics (mean, variance, distributions)", tag: "Math" },
      { text: "Set up Python environment with conda or venv", tag: "Python" },
      { text: "Practice NumPy and pandas for data manipulation", tag: "Python" },
    ],
    resources: ["3Blue1Brown (YouTube)", "Khan Academy", "fast.ai Practical DL", "NumPy docs"]
  },
  {
    title: "Core ML concepts",
    weeks: "Weeks 5–8",
    color: "#4ecb8d",
    colorBg: "rgba(78,203,141,0.12)",
    tasks: [
      { text: "Understand supervised vs unsupervised learning", tag: "Theory" },
      { text: "Learn the train/validation/test split concept", tag: "Theory" },
      { text: "Implement linear regression from scratch with NumPy", tag: "Code" },
      { text: "Implement logistic regression and understand loss functions", tag: "Code" },
      { text: "Understand gradient descent and how models learn", tag: "Theory" },
    ],
    resources: ["Hands-On ML (Géron)", "StatQuest (YouTube)", "Kaggle Learn", "scikit-learn docs"]
  },
  {
    title: "Scikit-learn & first projects",
    weeks: "Weeks 9–12",
    color: "#f5a623",
    colorBg: "rgba(245,166,35,0.12)",
    tasks: [
      { text: "Build decision trees and random forests with scikit-learn", tag: "Code" },
      { text: "Learn cross-validation, overfitting, and regularization", tag: "Theory" },
      { text: "Complete a Kaggle competition (Titanic or House Prices)", tag: "Project" },
      { text: "Learn feature engineering and data preprocessing pipelines", tag: "Code" },
      { text: "Evaluate models with precision, recall, F1, and confusion matrices", tag: "Theory" },
    ],
    resources: ["Kaggle Competitions", "scikit-learn User Guide", "Towards Data Science"]
  },
  {
    title: "Neural networks & PyTorch",
    weeks: "Weeks 13–20",
    color: "#a78bfa",
    colorBg: "rgba(167,139,250,0.12)",
    tasks: [
      { text: "Understand how neural networks work: layers, activations, backprop", tag: "Theory" },
      { text: "Learn PyTorch: tensors, autograd, and training loops", tag: "Code" },
      { text: "Train a simple feedforward network on a real dataset (e.g. MNIST)", tag: "Project" },
      { text: "Experiment with CNNs for image data or RNNs for sequences", tag: "Code" },
    ],
    resources: ["fast.ai course", "PyTorch tutorials", "Deep Learning (Goodfellow)", "Papers With Code"]
  },
  {
    title: "Custom model & deployment",
    weeks: "Weeks 21–28",
    color: "#f87171",
    colorBg: "rgba(248,113,113,0.12)",
    tasks: [
      { text: "Define your problem clearly: data sources, target variable, success metric", tag: "Plan" },
      { text: "Collect, clean, and explore your dataset (EDA)", tag: "Data" },
      { text: "Train and iterate on your custom model architecture", tag: "Train" },
      { text: "Tune hyperparameters with a systematic approach", tag: "Train" },
      { text: "Package and deploy the model (Flask API or Hugging Face Spaces)", tag: "Deploy" },
    ],
    resources: ["Hugging Face Spaces", "W&B for experiment tracking", "Streamlit for demos", "ONNX for export"]
  }
];

const TAG_COLORS = {
  Math:    ["rgba(79,142,247,0.15)",  "#4f8ef7"],
  Python:  ["rgba(78,203,141,0.15)",  "#4ecb8d"],
  Theory:  ["rgba(167,139,250,0.15)", "#a78bfa"],
  Code:    ["rgba(245,166,35,0.15)",  "#f5a623"],
  Project: ["rgba(78,203,141,0.15)",  "#4ecb8d"],
  Plan:    ["rgba(248,113,113,0.15)", "#f87171"],
  Data:    ["rgba(245,166,35,0.15)",  "#f5a623"],
  Train:   ["rgba(167,139,250,0.15)", "#a78bfa"],
  Deploy:  ["rgba(248,113,113,0.15)", "#f87171"],
};

const STORAGE_KEY = "ml_roadmap_v1";
let state = {};

function load() {
  try { state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { state = {}; }
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

const TOTAL = PHASES.reduce((s, p) => s + p.tasks.length, 0);

function toggleTask(pid, tid) {
  const key = `${pid}_${tid}`;
  state[key] = !state[key];
  save();
  render();
}

function togglePhase(pid) {
  const key = `open_${pid}`;
  state[key] = !state[key];
  save();
  render();
}

function resetAll() {
  if (!confirm("Reset all progress?")) return;
  state = {};
  save();
  render();
}

function render() {
  const container = document.getElementById("phases");
  container.innerHTML = "";

  let totalDone = 0;

  PHASES.forEach((phase, pi) => {
    const isOpen = !!state[`open_${pi}`];
    const doneTasks = phase.tasks.filter((_, ti) => state[`${pi}_${ti}`]).length;
    totalDone += doneTasks;
    const pct = phase.tasks.length ? Math.round(doneTasks / phase.tasks.length * 100) : 0;

    const [tc, tt] = [phase.colorBg, phase.color];

    const div = document.createElement("div");
    div.className = "phase" + (isOpen ? " open" : "");

    div.innerHTML = `
      <div class="phase-header" onclick="togglePhase(${pi})">
        <div class="phase-num" style="background:${tc};color:${tt}">0${pi+1}</div>
        <div class="phase-info">
          <div class="phase-title">${phase.title}</div>
          <div class="phase-sub">${phase.weeks} &nbsp;·&nbsp; ${doneTasks}/${phase.tasks.length}</div>
        </div>
        <div class="phase-right">
          <span class="phase-count">${pct}%</span>
          <span class="phase-chevron">▾</span>
        </div>
      </div>
      <div class="phase-bar">
        <div class="phase-bar-fill" style="width:${pct}%;background:${phase.color}"></div>
      </div>
      <div class="phase-body">
        ${phase.tasks.map((t, ti) => {
          const done = !!state[`${pi}_${ti}`];
          const [bg, col] = TAG_COLORS[t.tag] || ["rgba(255,255,255,0.08)","#888"];
          return `<div class="task${done ? ' done' : ''}" onclick="toggleTask(${pi},${ti})">
            <div class="task-check"></div>
            <div class="task-text">${t.text}</div>
            <span class="task-tag" style="background:${bg};color:${col}">${t.tag}</span>
          </div>`;
        }).join("")}
        <div class="resources">
          <div class="res-label">Resources</div>
          <div class="res-chips">
            ${phase.resources.map(r => `<span class="res-chip">${r}</span>`).join("")}
          </div>
        </div>
      </div>
    `;

    container.appendChild(div);
  });

  // Update global progress
  const pct = Math.round(totalDone / TOTAL * 100);
  const circ = 2 * Math.PI * 11;
  const offset = circ - (pct / 100) * circ;
  document.getElementById("global-ring").style.strokeDashoffset = offset;
  document.getElementById("global-text").innerHTML = `${totalDone} <span>/ ${TOTAL} tasks</span>`;
}

load();
render();
</script>
</body>
</html>
